name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Analyze issue with Claude
        id: analyze
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          prompt: |
            Analiza este issue del repositorio (Tetris en JS vanilla, sin build/test tooling):

            Issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}

            ${{ github.event.issue.body }}

            Resume el problema o solicitud, evalua si esta claro y accionable, senala informacion
            faltante si aplica, y sugiere una prioridad (alta/media/baja) y posibles archivos
            afectados (index.html, style.css, game.js).

            Publica tu analisis como UN comentario en el issue #${{ github.event.issue.number }}
            usando la herramienta mcp__github__add_issue_comment, formateado en GitHub Markdown:
            encabezado "## Analisis", lista con vinetas, y **negritas** para prioridad y archivos
            afectados. No modifiques codigo ni ejecutes comandos de build/test.
          claude_args: |
            --disallowedTools "Bash,Edit,Write,NotebookEdit"
