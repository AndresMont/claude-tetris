name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Analyze issue with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Analiza el issue #${{ github.event.issue.number }} de este repositorio (Tetris en JS vanilla).
            Resume el problema o solicitud, evalúa si esta claro y accionable, senala informacion faltante si aplica,
            y sugiere una prioridad (alta/media/baja) y posibles archivos afectados (index.html, style.css, game.js).
            Publica tu analisis como comentario en el issue. No modifiques codigo ni ejecutes comandos de build/test.
          claude_args: |
            --allowedTools "mcp__github__add_issue_comment"
            --disallowedTools "Bash,Edit,Write,NotebookEdit"
