<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <button id="theme-toggle" class="theme-toggle" aria-label="Cambiar tema" title="Cambiar tema">🌙</button>

    <h1 class="game-title">
      <span>T</span><span>E</span><span>T</span><span>R</span><span>I</span><span>S</span>
    </h1>

    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <div id="new-record-form" class="new-record-form hidden">
          <input id="player-name-input" type="text" maxlength="12" placeholder="Tu nombre" />
          <button id="save-record-btn">Guardar</button>
        </div>

        <div class="records-panel">
          <span class="label">TOP RECORDS</span>
          <ol id="overlay-records-list" class="records-list"></ol>
        </div>

        <div class="stats-row">
          <div class="panel-section">
            <span class="label">MEJOR COMBO</span>
            <span class="value" id="overlay-best-combo">0</span>
          </div>
          <div class="panel-section">
            <span class="label">MEJORES LÍNEAS</span>
            <span class="value" id="overlay-best-lines">0</span>
          </div>
        </div>

        <button id="restart-btn">Reiniciar</button>
        <button id="reset-records-btn" class="reset-btn">Resetear records</button>
      </div>
    </div>

    <div id="start-overlay" class="overlay">
      <div class="overlay-box">
        <p id="start-title">TETRIS</p>

        <div class="records-panel">
          <span class="label">TOP RECORDS</span>
          <ol id="start-records-list" class="records-list"></ol>
        </div>

        <div class="stats-row">
          <div class="panel-section">
            <span class="label">MEJOR COMBO</span>
            <span class="value" id="start-best-combo">0</span>
          </div>
          <div class="panel-section">
            <span class="label">MEJORES LÍNEAS</span>
            <span class="value" id="start-best-lines">0</span>
          </div>
        </div>

        <button id="play-btn">Jugar</button>
        <button id="reset-records-start-btn" class="reset-btn">Resetear records</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
